    <section class="project-grid">
      <button class="project-card" data-title="⋆ St. Anthony's Gardens ⋆" data-image="img/gd1.png" data-description="Logo created for St. Anthony's Gardens Residents Fellowship in Covington, Louisiana. The process was guided by real-world client feedback, culminating in a final one-on-one presentation of the design. The finalized logo features a lily (symbol for Saint Anthony) abstracted as a fleur-de-lis (symbol for Louisiana) with a purple-yellow palette chosen to honor Louisianian culture. The stamen of the lily is meant to look as though two hands are praying, and the ornamental 'fishes' represent Christianity, all of which satisfied the client's request to incorporate cultural and religious symbolism.">
        <img class="project-thumb" src="img/gd1.png" alt="Retirement home logo">
        <span>StAG Logo</span>
      </button>

      <button class="project-card" data-title="⋆ Shandong WikiBook ⋆" data-image="img/gd2.png" data-description="Honoring my Chinese heritage, I chose to base the design on the province of Shandong. The visual identity of the book is a contemporary interpretation of traditional East Asian newspaper styles and motifs. In the absence of color, the eclectic yet monotonous aesthetic emulates the social turmoil of a culturally-rich nation (China) facing rapid commercialization. In addition to the exploration of Chinese typography, the book features a monospace typeface supplemented with a quirky sans-serif. Emphasis on culturally-informed design through abstraction, contrast, layout, and typography.">
        <img class="project-thumb" src="img/gd2.png" alt="Chinese WikiBook Cover">
        <span>SHANDONG!</span>
      </button>

      <button class="project-card" data-title="⋆ MVMT ⋆" data-image="img/gd3.jpg" data-description="A visual abstraction of motion, one of the fundamental principles of art.">
        <img class="project-thumb" src="img/gd3.jpg" alt="Abstraction graphic of movement">
        <span>MVMT</span>
      </button>

      <button class="project-card" data-title="⋆ COLE. ⋆" data-image="img/gd4.jpg" data-description="After tracing a photograph of myself and scanning it into Adobe Illustrator, I explored texture and negative space to create an abstract and digitized self-portrait that represents facets of my identity and who I am.">
        <img class="project-thumb" src="img/gd4.jpg" alt="Digital Portrait">
        <span>COLE.</span>
      </button>

      <button class="project-card" data-title="⋆ Polar Forge ⋆" data-image="img/gd5.png" data-description="A logo designed for a fictional bladesmith company, Polar Forge. The design merges the walrus with swords, a challenging process combining both physical cut-paper technique and digitized Illustrator design.">
        <img class="project-thumb" src="img/gd5.png" alt="Walrus Logo">
        <span>Polar Forge</span>
      </button>

      <button class="project-card" data-title="⋆ Withering Iris ⋆" data-image="img/trad1.jpg" data-description="A painting depicting 4 stages of decomposition of a purple Dutch iris flower made with gouache. With only cyan, magenta, and yellow gouache, this project was largely a practice in color theory.">
        <img class="project-thumb" src="img/trad1.jpg" alt="Iris Painting">
        <span>Withering Iris</span>
      </button>

      <button class="project-card" data-title="⋆ Triptych Drawing ⋆" data-image="img/trad2.jpeg" data-description="Charcoal triptych of random miscellaneous objects.">
        <img class="project-thumb" src="img/trad2.jpeg" alt="Charcoal Triptych">
        <span>Triptych</span>
      </button>

      <button class="project-card" data-title="⋆ Nature 9 Times ⋆" data-image="img/trad3.jpg" data-description="A mixed media composition featuring a goat drawn 9 different times in 9 different styles. From left to right, the styles include: Gothic, naturalist, 'x-ray vision', Cubist, negative space, 'swirls', Renaissance, psychedelic, & Dr. Seuss. Mediums included graphite, India Ink, and micron pen.">
        <img class="project-thumb" src="img/trad3.jpg" alt="9 Goat Drawings">
        <span>Nature 9 Times</span>
      </button>

      <button class="project-card" data-title="⋆ CAPRICORN TROPHY ⋆" data-image="img/trad4.jpeg" data-description="My interpretation of a Capricorn trophy mount, created with welded wire and tissue paper. The sculpture was later mounted, scanned, and 3D printed.">
        <img class="project-thumb" src="img/trad4.jpeg" alt="Paper Goat Head">
        <span>CAPRICORN TROPHY</span>
      </button>

      <button class="project-card" data-title="⋆ Art of Drag ⋆" data-image="img/ph1.JPG" data-description="A series of intimate photoshoots celebrating the behind-the-scenes of drag culture.">
        <img class="project-thumb" src="img/ph1.JPG" alt="Drag Queen">
        <span>Art of DRAG!</span>
      </button>

      <button class="project-card" data-title="⋆ LIZARD ⋆" data-image="img/ph2.JPG" data-description="A series of photoshoots exploring various photography techniques. This specific photograph features a small lizard resting upon a leaf, highlighting figure/ground relationship.">
        <img class="project-thumb" src="img/ph2.JPG" alt="Lizard">
        <span>Lizard</span>
      </button>

      <button class="project-card" data-title="⋆ Evening Cocktail ⋆" data-image="img/ph3.jpg" data-description="A series of photoshoots emphasizing photographic storytelling. This particular photoshoot followed the daily life of a bartender who frequents local dive bars in her off-time.">
        <img class="project-thumb" src="img/ph3.jpg" alt="Girl with Cocktail">
        <span>A drink?</span>
      </button>
