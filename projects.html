<!doctype html>
<html lang="en">

  <meta name="description" content="a minimalist interactive portfolio showcasing design work, projects, and contact information.">

  <div class="modal" id="project-modal">
    <div class="modal-bg"></div>

    <div class="modal-box">
      <button class="modal-close">close</button>

      <h2 id="modal-title" class="reveal-step"></h2>

      <div class="modal-img-wrap reveal-step">
        <img id="modal-image" src="" alt="">
      </div>

      <p id="modal-description" class="reveal-step"></p>
    </div>
  </div>

  <script src="js/main.js"></script>
