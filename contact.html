<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>portfolio | contact</title>
  <meta name="description" content="a minimalist interactive portfolio showcasing design work, projects, and contact information.">

  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="css/main.css">

  <meta name="theme-color" content="#f4f1ec">
</head>

<body>
  <header class="site-logo">
    <a href="index.html">
      <img src="img/logo.png" alt="personal logo">
    </a>
  </header>

  <nav class="edge-nav">
    <a class="nav-home" href="index.html">home</a>
    <a class="nav-projects" href="projects.html">projects</a>
    <a class="nav-about" href="about.html">about</a>
    <a class="nav-contact active" href="contact.html">contact</a>
  </nav>

  <main class="content-layout">
    <section class="contact-layout">
      <div>
        <p class="eyebrow">contact</p>
        <h1>let's connect.</h1>
        <p>write a short contact note here. you can include your email, availability, or collaboration interests.</p>
      </div>

      <form class="contact-form">
        <label for="name">name</label>
        <input id="name" type="text" placeholder="your name">

        <label for="email">email</label>
        <input id="email" type="email" placeholder="your email">

        <label for="message">message</label>
        <textarea id="message" rows="6" placeholder="your message"></textarea>

        <button type="submit">send message</button>
        <p id="form-message"></p>
      </form>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
