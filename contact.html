<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>portfolio | contact</title>
  <meta name="description" content="interactive portfolio with contact form for cole chen">

  <link rel="icon" href="img/Web Design P4 Favicon.png">
  <link rel="stylesheet" href="css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Smokum&display=swap" rel="stylesheet">

  <meta name="theme-color" content="#f4f1ec">
</head>

<body class="contact-page">
  <header class="site-logo">
    <a href="index.html">
      <img src="img/C-LOGOorngE.png" alt="cole chen logo">
    </a>
  </header>

  <nav class="edge-nav">
    <a class="nav-home" href="index.html">home</a>
    <a class="nav-projects" href="projects.html">projects</a>
    <a class="nav-about" href="about.html">about</a>
    <a class="nav-contact active" href="contact.html">contact</a>
  </nav>

  <main class="content-layout">
    <section class="contact-layout">
      <div>
        <p class="eyebrow">contact</p>
        <h1>let's connect.</h1>
        <p>feel free to reach out for projects, collabs, questions, or anything in between!</p>
      </div>

      <form class="contact-form" id="contact-form" novalidate>
        <label for="name">name</label>
        <input id="name" type="text" placeholder="your name">

        <label for="email">email</label>
        <input id="email" type="email" placeholder="your email">

        <label for="message">message</label>
        <textarea id="message" rows="6" placeholder="your message"></textarea>

        <button type="submit">send it</button>
      </form>
    </section>
  </main>

  <a class="linkedin-link" href="https://www.linkedin.com/in/colin-chen-911a48269/" target="_blank" rel="noopener">
    <img src="img/LinkedIn Portfolio Site Icon.png" alt="linkedin">
  </a>

  <script src="js/script.js"></script>
</body>
</html>
